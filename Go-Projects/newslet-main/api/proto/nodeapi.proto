syntax = "proto3";
package nodeapi;
// Sample proto file for the node service
// This file defines the Node service and the Message type used for communication
// between nodes in the network.
option go_package = "github.com/rawan-bekheet/newslet/api/nodeapi;nodeapi";

service Node {
    rpc Exchange(stream Message) returns (stream Message) {}
}

message Message {
    int32 id = 1;
    int32 clock = 2;
    enum Type {REQUEST = 0; RESPONSE = 1;}
    Type type = 3;
    int32 request_ts = 4; // Only valid for REQUEST
}
